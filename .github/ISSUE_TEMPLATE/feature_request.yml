name: "Feature Request"
description: "Suggest an improvement to OnFlight"
title: "[Feature] "

body:
  - type: textarea
    id: requested-feature
    attributes:
      label: What would you like?
    validations:
      required: true

  - type: textarea
    id: usefulness
    attributes:
      label: Why would this be useful?
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
    validations:
      required: false
